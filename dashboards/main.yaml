# Main — household dashboard: Home, Energy, Lamps and Internet.
# Registered in configuration.yaml as lovelace.dashboards.dashboard-main.
views:
  # ─────────────────────────────────────────────────────────────────────────────
  # Home — kitchen, living room, laundry, weather, garage
  # ─────────────────────────────────────────────────────────────────────────────
  - title: Home
    path: home
    type: sections
    icon: mdi:home
    max_columns: 4
    sections:
      # Kitchen
      - type: grid
        cards:
          - type: heading
            icon: mdi:fridge
            heading: Kitchen
            heading_style: title

          - type: media-control
            entity: media_player.kitchen_speaker
            visibility:
              - condition: state
                entity: media_player.kitchen_speaker
                state_not: unavailable

          - type: entities
            entities:
              - sensor.dishwasher_program_finish_time
            visibility:
              - condition: state
                entity: sensor.dishwasher_program_finish_time
                state_not: unavailable

          - type: heading
            icon: mdi:fridge
            heading: Trash
            heading_style: title

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.afvalinfo_afval_trash_type_tomorrow
                state_not: "no"
              - condition: state
                entity: sensor.afvalinfo_afval_trash_type_tomorrow
                state_not: unknown
            card:
              type: markdown
              content: |
                # 🚨🗑️ Trash Day
                ## **{{ states('sensor.afvalinfo_afval_trash_type_tomorrow') }}**

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.afvalinfo_afval_trash_type_today
                state_not: unknown
              - condition: state
                entity: sensor.afvalinfo_afval_trash_type_today
                state_not: "no"
            card:
              type: markdown
              content: |
                # 🔙 🗑️ Collect Kliko

          - type: entities
            entities:
              - entity: sensor.afvalinfo_afval_gft
                name: GFT
                icon: mdi:leaf-circle
              - entity: sensor.afvalinfo_afval_pbd
                name: PMD
                icon: mdi:recycle
                secondary_info: none
              - entity: sensor.afvalinfo_afval_restafval
                name: RestAfval
                icon: mdi:delete
              - entity: sensor.afvalinfo_afval_papier
                icon: mdi:paper-cut-vertical
            state_color: true

      # Living Room & Laundry
      - type: grid
        cards:
          - type: heading
            heading: Living Room
            heading_style: title
            icon: mdi:sofa

          - type: tile
            entity: light.sofa_lamp
            features_position: bottom
            vertical: false

          - type: tile
            entity: light.coffee_lamp
            features_position: bottom
            vertical: false

          - type: heading
            icon: mdi:hanger
            heading: Laundry
            heading_style: title
            visibility:
              - condition: state
                entity: timer.dryer_machine_timer
                state_not: idle
              - condition: or
                conditions:
                  - condition: state
                    entity: timer.washing_machine_timer
                    state_not: idle

          - type: entities
            entities:
              - entity: timer.washing_machine_timer
                name: Washing
            grid_options:
              columns: 6
              rows: auto
            visibility:
              - condition: state
                entity: timer.washing_machine_timer
                state_not: idle

          - type: entities
            entities:
              - entity: timer.dryer_machine_timer
                name: Drying
            grid_options:
              columns: 6
              rows: auto
            visibility:
              - condition: state
                entity: timer.dryer_machine_timer
                state_not: idle

      # Weather
      - type: grid
        cards:
          - type: heading
            heading: Weather
            heading_style: title
            icon: mdi:weather-sunny-alert

          - show_current: true
            show_forecast: true
            type: weather-forecast
            entity: weather.buienradar
            forecast_type: daily

      # Garage
      - type: grid
        cards:
          - type: heading
            icon: mdi:garage-open
            heading: Garage
            heading_style: title

          - show_name: true
            show_icon: true
            type: button
            tap_action:
              action: perform-action
              perform_action: switch.turn_on
              target:
                entity_id: switch.gate_relay
            entity: switch.gate_relay
            name: Garage Door
            icon: mdi:garage
            hold_action:
              action: toggle

  # ─────────────────────────────────────────────────────────────────────────────
  # Energy — live power, solar production and the Energy dashboard figures
  # Helios and the consumption graph live here; they used to sit on Home.
  # ─────────────────────────────────────────────────────────────────────────────
  - title: Energy
    path: energy
    type: sections
    icon: mdi:solar-power-variant
    max_columns: 4
    sections:
      # Live values
      - type: grid
        title: Now
        cards:
          - type: tile
            entity: sensor.p1_meter_power
            name: Grid
            icon: mdi:transmission-tower
            grid_options:
              columns: 6

          # Measured inverter output, not the Forecast.Solar estimate
          - type: tile
            entity: sensor.zonneplan_one_optimized_omvormer_last_measured_value
            name: Solar Now
            icon: mdi:solar-power
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.zonneplan_yield_today
            name: Solar Today
            icon: mdi:solar-power-variant
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.energy_production_today_remaining
            name: Forecast Left Today
            icon: mdi:weather-sunset-up
            grid_options:
              columns: 6

      # Helios 2.5D solar visualisation (reads the Energy dashboard preferences)
      - type: grid
        title: Solar
        cards:
          - type: custom:helios-card
            cache-id: cmr1241bu87541y
            auto-rotate-enabled: false
            display-radius: 200
            home-color: orange
            grid_options:
              columns: full

      # Consumption history
      - type: grid
        title: Consumption
        cards:
          - type: custom:mini-graph-card
            entities:
              - sensor.p1_meter_power
            icon: mdi:lightning-bolt
            name: Energy Consumption
            hours_to_show: 6
            group_by: hour
            animate: true
            hour24: true
            color_thresholds:
              - value: 1000
                color: "#F4511E"
              - value: 500
                color: "#FBC02D"
              - value: 0
                color: "#FB8C00"
              - value: -1
                color: "#7CB342"
              - value: -500
                color: "#00897B"
              - value: -1000
                color: "#1E88E5"
            grid_options:
              columns: full

      # Figures derived from long-term statistics and the Energy preferences
      - type: grid
        title: Today
        cards:
          - type: energy-date-selection
            collection_key: energy_overview

          - type: energy-distribution
            collection_key: energy_overview
            link_dashboard: true

          - type: energy-self-sufficiency-gauge
            collection_key: energy_overview

          - type: energy-sources-table
            collection_key: energy_overview

  # ─────────────────────────────────────────────────────────────────────────────
  # Lamps
  # ─────────────────────────────────────────────────────────────────────────────
  - type: sections
    max_columns: 4
    title: Lamps
    path: lamps
    sections:
      - type: grid
        cards:
          - type: heading
            heading: New section

          - type: light
            entity: light.master_lamp

          - type: light
            entity: light.julia_lamp

          - type: light
            entity: light.guilherme_lamp

          - type: light
            entity: light.office_lamp

  # ─────────────────────────────────────────────────────────────────────────────
  # Internet — AdGuard Home
  # ─────────────────────────────────────────────────────────────────────────────
  - type: sections
    max_columns: 4
    title: Internet
    path: internet
    icon: mdi:access-point-network
    sections:
      - type: grid
        cards:
          - type: heading
            heading: New section

          - type: tile
            entity: switch.adguard_home_protection
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: sensor.adguard_home_dns_queries_blocked_ratio
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: switch.adguard_home_filtering
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: sensor.adguard_home_parental_control_blocked
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: switch.adguard_home_query_log
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: switch.adguard_home_safe_browsing
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: sensor.adguard_home_safe_browsing_blocked
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: switch.adguard_home_safe_search
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: sensor.adguard_home_safe_searches_enforced
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: sensor.adguard_home_dns_queries_blocked
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: sensor.adguard_home_dns_queries
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: sensor.adguard_home_average_processing_speed
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

          - type: tile
            entity: update.adguard_home
            vertical: false
            features_position: bottom
            grid_options:
              columns: full

  # ─────────────────────────────────────────────────────────────────────────────
  # Music — Music Assistant playlist buttons playing on All Speakers
  # ─────────────────────────────────────────────────────────────────────────────
  - title: Music
    path: music
    type: sections
    icon: mdi:music
    max_columns: 2
    sections:
      # Playback controls for the Music Assistant group
      - type: grid
        cards:
          - type: heading
            heading: Now Playing
            heading_style: title
            icon: mdi:speaker-multiple

          - type: media-control
            entity: media_player.all_speakers

      # One tap plays the playlist and enables shuffle via script.play_playlist
      - type: grid
        cards:
          - type: heading
            heading: Playlists
            heading_style: title
            icon: mdi:playlist-music

          - type: grid
            columns: 2
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Coffee is ready
                    heading_style: subtitle
                    icon: mdi:coffee

                  - type: picture
                    image: https://mosaic.scdn.co/640/ab67616d00001e022fefe7a9143a3089f786a861ab67616d00001e02a20f207a64ce7139907b8247ab67616d00001e02aedbd4cfb18eaf688ae3d288ab67616d00001e02e6c0c82dce5500529fe943a3
                    alt_text: Coffee is ready playlist cover
                    tap_action:
                      action: perform-action
                      perform_action: script.play_playlist
                      data:
                        playlist: library://playlist/115

              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Sky Radio Hits
                    heading_style: subtitle
                    icon: mdi:radio

                  - type: picture
                    image: https://image-cdn-fa.spotifycdn.com/image/ab67706c0000da8465015bf77e3548609085e8e6
                    alt_text: Sky Radio Hits playlist cover
                    tap_action:
                      action: perform-action
                      perform_action: script.play_playlist
                      data:
                        playlist: library://playlist/127

              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Italian Classics
                    heading_style: subtitle
                    icon: mdi:food-variant

                  - type: picture
                    image: https://mosaic.scdn.co/640/ab67616d00001e02228264ef165a3de1041d0c22ab67616d00001e0256e5814ac36841ba7f992b65ab67616d00001e026fe5eb859b38facc2c1cadc5ab67616d00001e02d919d138f6e83aba728bd697
                    alt_text: Italian Classics playlist cover
                    tap_action:
                      action: perform-action
                      perform_action: script.play_playlist
                      data:
                        playlist: library://playlist/98

              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Easy Listening
                    heading_style: subtitle
                    icon: mdi:sofa

                  - type: picture
                    image: https://mosaic.scdn.co/640/ab67616d00001e02077d7271b180ff4d3e1f7cd7ab67616d00001e0231edc5bd8f156b173015ed19ab67616d00001e025d11c2fe73a7d376d3b06107ab67616d00001e02db5d336c648e8f540262a1c2
                    alt_text: Easy Listening playlist cover
                    tap_action:
                      action: perform-action
                      perform_action: script.play_playlist
                      data:
                        playlist: library://playlist/97
